[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "local-readonly-mcp"
version = "0.3.1"
description = "A thin, configurable, read-only local filesystem MCP server with bounded output and secret filtering."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KunCheung" }]
dependencies = [
  "mcp[cli]>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.setuptools]
py-modules = ["server", "filesystem", "config"]
